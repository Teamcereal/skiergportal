[project]
name = "skiergportal"
version = "0.1.0"
description = "Local Streamlit portal for Concept2 SkiErg training history"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "streamlit-aggrid>=1.1",
    "pandas>=2.2",
    "plotly>=5.22",
    "numpy>=2.0",
    "requests>=2.32",
    "pillow>=10.4",
]

[dependency-groups]
build = ["pyinstaller>=6.10"]

[tool.uv]
package = false