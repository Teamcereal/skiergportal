name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked build dependencies
        run: uv sync --project data/system --frozen --group build

      - name: Test release and update code
        run: uv run --project data/system --frozen --group build python -m unittest discover -s data/system -p 'test_*.py'

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: pwsh
        working-directory: data/system
        run: |
          $version = uv run --frozen --group build python -c "from skiergportal_version import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the application version." }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match application version v$version."
          }

      - name: Prepare build directories
        shell: pwsh
        run: |
          $systemRoot = Join-Path $env:GITHUB_WORKSPACE "data/system"
          $buildRoot = Join-Path $systemRoot "build"
          $distRoot = Join-Path $systemRoot "dist"
          Remove-Item -LiteralPath $buildRoot, $distRoot -Recurse -Force -ErrorAction SilentlyContinue
          $buildPaths = @(
            (Join-Path $buildRoot "launcher/spec"),
            (Join-Path $buildRoot "launcher/work"),
            (Join-Path $buildRoot "server/spec"),
            (Join-Path $buildRoot "server/work"),
            (Join-Path $buildRoot "updater/spec"),
            (Join-Path $buildRoot "updater/work"),
            $distRoot
          )
          New-Item -ItemType Directory -Force -Path $buildPaths | Out-Null

      - name: Build GUI launcher
        shell: pwsh
        run: |
          $systemRoot = Join-Path $env:GITHUB_WORKSPACE "data/system"
          $launcherSource = Join-Path $systemRoot "Start-Treningshistorikk-GUI.pyw"
          if (-not (Test-Path -LiteralPath $launcherSource -PathType Leaf)) {
            throw "GUI launcher source not found: $launcherSource"
          }

          uv run --project $systemRoot --frozen --group build pyinstaller `
            --clean --noconfirm --onedir --windowed `
            --name SkiErgPortal `
            --distpath (Join-Path $systemRoot "dist") `
            --workpath (Join-Path $systemRoot "build/launcher/work") `
            --specpath (Join-Path $systemRoot "build/launcher/spec") `
            $launcherSource
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed to build the GUI launcher." }

      - name: Build Streamlit server
        shell: pwsh
        run: |
          $systemRoot = Join-Path $env:GITHUB_WORKSPACE "data/system"
          $appSource = Join-Path $systemRoot "treningshistorikk_app"
          $appScriptSource = Join-Path $appSource "app.py"
          $serverSource = Join-Path $systemRoot "streamlit_server.py"
          foreach ($source in @($appSource, $appScriptSource, $serverSource)) {
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Streamlit build source not found: $source"
            }
          }

          $appData = "${appSource};app"
          uv run --project $systemRoot --frozen --group build pyinstaller `
            --clean --noconfirm --onedir `
            --contents-directory . `
            --name streamlit_server `
            --distpath (Join-Path $systemRoot "dist/SkiErgPortal") `
            --workpath (Join-Path $systemRoot "build/server/work") `
            --specpath (Join-Path $systemRoot "build/server/spec") `
            --collect-all streamlit `
            --collect-all st_aggrid `
            --collect-all plotly `
            --collect-all PIL `
            --add-data $appData `
            $serverSource
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed to build the Streamlit server." }

      - name: Build update helper
        shell: pwsh
        run: |
          $systemRoot = Join-Path $env:GITHUB_WORKSPACE "data/system"
          $updaterSource = Join-Path $systemRoot "app_update_helper.py"
          if (-not (Test-Path -LiteralPath $updaterSource -PathType Leaf)) {
            throw "Update helper source not found: $updaterSource"
          }

          uv run --project $systemRoot --frozen --group build pyinstaller `
            --clean --noconfirm --onefile --windowed `
            --name SkiErgPortalUpdater `
            --distpath (Join-Path $systemRoot "dist/SkiErgPortal") `
            --workpath (Join-Path $systemRoot "build/updater/work") `
            --specpath (Join-Path $systemRoot "build/updater/spec") `
            $updaterSource
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed to build the update helper." }

      - name: Include usage instructions
        run: Copy-Item data/README.md data/system/dist/SkiErgPortal/README.md

      - name: Include application version
        shell: pwsh
        working-directory: data/system
        run: |
          $version = uv run --frozen --group build python -c "from skiergportal_version import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the application version." }
          Set-Content -LiteralPath "dist/SkiErgPortal/version.txt" -Value $version -NoNewline -Encoding ascii

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $appRoot = (Resolve-Path data/system/dist/SkiErgPortal).Path
          $launcherExe = Join-Path $appRoot "SkiErgPortal.exe"
          $serverRoot = Join-Path $appRoot "streamlit_server"
          $serverExe = Join-Path $serverRoot "streamlit_server.exe"
          $updaterExe = Join-Path $appRoot "SkiErgPortalUpdater.exe"
          $versionFile = Join-Path $appRoot "version.txt"
          $appScript = Join-Path $serverRoot "app/app.py"
          $streamlitStaticIndex = Join-Path $serverRoot "streamlit/static/index.html"
          foreach ($requiredFile in @($launcherExe, $serverExe, $updaterExe, $versionFile, $appScript, $streamlitStaticIndex)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Expected packaged file is missing: $requiredFile"
            }
          }
          if (Test-Path (Join-Path $appRoot "Data")) {
            throw "Writable training data must not be packaged with the application."
          }
          & $serverExe --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged Streamlit CLI smoke test failed." }
          & $updaterExe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged updater smoke test failed." }

          $env:SKIERGPORTAL_DATA_DIR = Join-Path $env:LOCALAPPDATA "SkiErgPortal\SmokeData"
          New-Item -ItemType Directory -Force -Path $env:SKIERGPORTAL_DATA_DIR | Out-Null
          $smokeLog = Join-Path $env:TEMP "SkiErgPortal-launcher-smoke.log"
          Remove-Item -LiteralPath $smokeLog -Force -ErrorAction SilentlyContinue
          $env:SKIERGPORTAL_SMOKE_LOG = $smokeLog
          & $launcherExe --smoke-test
          $launcherExitCode = $LASTEXITCODE
          Remove-Item Env:SKIERGPORTAL_SMOKE_LOG -ErrorAction SilentlyContinue
          if ($launcherExitCode -ne 0) {
            if (Test-Path -LiteralPath $smokeLog) { Get-Content -LiteralPath $smokeLog }
            throw "Packaged launcher smoke test failed with exit code $launcherExitCode."
          }

          $server = $null
          $serverStdout = Join-Path $env:TEMP "SkiErgPortal-streamlit.stdout.log"
          $serverStderr = Join-Path $env:TEMP "SkiErgPortal-streamlit.stderr.log"
          Remove-Item -LiteralPath $serverStdout, $serverStderr -Force -ErrorAction SilentlyContinue
          try {
            $server = Start-Process -FilePath $serverExe -ArgumentList @(
              "run", $appScript, "--server.address", "127.0.0.1",
              "--server.port", "8765", "--server.headless", "true",
              "--global.developmentMode=false"
            ) -WorkingDirectory $env:SKIERGPORTAL_DATA_DIR -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $serverStdout -RedirectStandardError $serverStderr
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              if ($server.HasExited) {
                if (Test-Path -LiteralPath $serverStdout) { Get-Content -LiteralPath $serverStdout }
                if (Test-Path -LiteralPath $serverStderr) { Get-Content -LiteralPath $serverStderr }
                throw "Packaged Streamlit server exited during startup."
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/_stcore/health" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) {
              if (Test-Path -LiteralPath $serverStdout) { Get-Content -LiteralPath $serverStdout }
              if (Test-Path -LiteralPath $serverStderr) { Get-Content -LiteralPath $serverStderr }
              throw "Packaged Streamlit health endpoint did not become ready."
            }
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
              Wait-Process -Id $server.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Package Windows release
        shell: pwsh
        working-directory: data/system
        run: |
          $systemRoot = Join-Path $env:GITHUB_WORKSPACE "data/system"
          $appRoot = Join-Path $systemRoot "dist/SkiErgPortal"
          $releaseRoot = Join-Path $systemRoot "dist/release"
          $stagingRoot = Join-Path $releaseRoot "staging"
          $zipPath = Join-Path $releaseRoot "SkiErgPortal-windows-x64.zip"
          if (Test-Path -LiteralPath $releaseRoot) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          Copy-Item -LiteralPath $appRoot -Destination (Join-Path $stagingRoot "SkiErgPortal") -Recurse
          Compress-Archive -Path (Join-Path $stagingRoot "SkiErgPortal") -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zipPath.sha256" -Value "$hash  SkiErgPortal-windows-x64.zip" -NoNewline -Encoding ascii
          Remove-Item -LiteralPath $stagingRoot -Recurse -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SkiErgPortal-windows-x64
          path: |
            data/system/dist/release/SkiErgPortal-windows-x64.zip
            data/system/dist/release/SkiErgPortal-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: SkiErgPortal-windows-x64
          path: release-assets

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "SkiErgPortal $env:GITHUB_REF_NAME" `
            --generate-notes `
            release-assets/SkiErgPortal-windows-x64.zip `
            release-assets/SkiErgPortal-windows-x64.zip.sha256
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub Release $env:GITHUB_REF_NAME." }
